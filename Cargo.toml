[package]
name = "binspec"
description = "A package for defining and decoding binary formats using Rust's macro system."
repository = "https://github.com/mahdoosh1/binspec"
license = "GPL-2.0"
# license-file = "LICENSE"
readme = "README.md"
keywords = ["binary", "decoding", "formats", "macro"]
categories = ["parsing"]
version = "0.1.0"
edition = "2024"

[dependencies]
either = "1.17.0"
memmap2 = "0.9.11"
thiserror = "2.0.18"
